name: Publish RPM to Release
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Sleep for 2 minutes to let OBS build
        run: sleep 120

      - name: Download RPM
        run: |
          # Use input version if manually triggered, otherwise use the tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "Downloading RPMs for version $VERSION..."
          mkdir -p downloads
          wget -r -l1 -nd -A "zypperx-$VERSION-*.noarch.rpm" -P downloads \
            "https://download.opensuse.org/repositories/home:/itachi_re/openSUSE_Tumbleweed/noarch/"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: downloads/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
