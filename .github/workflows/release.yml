name: Publish RPM to Release
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0) — RPM must already exist on OBS'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # Only wait on tag push — OBS was just triggered by the webhook.
      # On manual runs the RPM already exists on OBS from the original tag push.
      - name: Wait for OBS to build (tag push only)
        if: github.event_name == 'push'
        run: sleep 120

      - name: Download RPM
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "Downloading RPMs for version $VERSION..."
          mkdir -p downloads
          wget -r -l1 -nd -A "zypperx-$VERSION-*.noarch.rpm" -P downloads \
            "https://download.opensuse.org/repositories/home:/itachi_re/openSUSE_Tumbleweed/noarch/"

          # Fail early if nothing was downloaded
          if [ -z "$(ls downloads/*.rpm 2>/dev/null)" ]; then
            echo "ERROR: No RPM found for version $VERSION on OBS."
            echo "Make sure the tag exists and OBS has finished building it."
            exit 1
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: downloads/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
