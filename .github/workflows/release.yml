name: Publish RPM to Release
on:
  push:
    tags:
      - '*.*.*'  # Matches any semver tag: 1.1.0, 1.1.1, 2.0.0 etc.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Sleep for 2 minutes to let OBS build
        run: sleep 120

      - name: Download RPM
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Downloading RPMs for version $VERSION..."
          mkdir -p downloads
          wget -r -l1 -nd -A "zypperx-$VERSION-*.noarch.rpm" -P downloads \
            "https://download.opensuse.org/repositories/home:/itachi_re/openSUSE_Tumbleweed/noarch/"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: downloads/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
