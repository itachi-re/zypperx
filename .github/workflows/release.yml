name: Publish RPM to Release

on:
  push:
    tags:
      - '0.*' # Runs on tags like 0.0.1, 0.0.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Wait for OBS to build (simplistic wait, or just assume it's fast)
      - name: Sleep for 2 minutes to let OBS build
        run: sleep 120

      # 2. Download the RPM from your public OBS URL
      - name: Download RPM
        run: |
          # Logic to find the filename based on the tag
          VERSION=${GITHUB_REF#refs/tags/}
          # Note: OBS release numbers (e.g. 8.1) change, so we might need a wildcard download
          wget -r -l1 -nd -A "zypperx-$VERSION-*.noarch.rpm" https://download.opensuse.org/repositories/home:/itachi_re/openSUSE_Tumbleweed/noarch/

      # 3. Upload to GitHub Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: *.rpm
