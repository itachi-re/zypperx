name: Publish RPM to Release

on:
  push:
    tags:
      - '0.*' # Runs on tags like 0.0.1, 0.0.2

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    steps:
      - uses: actions/checkout@v3

      # 1. Wait for OBS to build (simplistic wait)
      - name: Sleep for 2 minutes to let OBS build
        run: sleep 120

      # 2. Download the RPM from your public OBS URL
      - name: Download RPM
        run: |
          # Logic to find the filename based on the tag
          VERSION=${GITHUB_REF#refs/tags/}
          # Create directory to store downloads
          mkdir -p downloads
          # Download matching RPMs
          wget -r -l1 -nd -A "zypperx-$VERSION-*.noarch.rpm" -P downloads "https://download.opensuse.org/repositories/home:/itachi_re/openSUSE_Tumbleweed/noarch/"

      # 3. Upload to GitHub Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: downloads/*.rpm
